# Render Blueprint for the Abdelkhalek_Store frontend (Vite + React SPA).
# Deploy via: New > Blueprint, or create a Static Site manually with these values.
#
# Service type:    Static Site
# Root directory:  (repo root — frontend lives at the repository root)
# Build command:   npm ci && npm run build
# Publish dir:     dist
services:
  - type: web
    name: abdelkhalek-store-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA catch-all: serve index.html for every client-side route
      # (/login, /dashboard, /products, /categories, /customers, /sales,
      # /settings, ...) so refresh/deep links never 404.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public API base URL, baked into the bundle at build time.
      - key: VITE_API_URL
        value: https://abdelkhalek-store.onrender.com

  # FastAPI backend. The service name matches the live API subdomain
  # (abdelkhalek-store.onrender.com) so re-applying this blueprint updates the
  # existing service instead of creating a duplicate. Data persistence relies
  # on an external managed PostgreSQL database (e.g. Neon free tier) and on
  # uploaded logos being stored inside that database — no persistent disk is
  # required, so the service can stay on the Free plan.
  - type: web
    name: abdelkhalek-store
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # DATABASE_URL is a secret containing credentials, so it is NOT stored in
      # this repo. Configure it manually in the Render dashboard under
      # Service -> Environment for "abdelkhalek-store".
      #
      #   Value (Neon): postgresql://user:password@host/neondb?sslmode=require
      #
      # If DATABASE_URL is missing/unset, the backend falls back to the local
      # SQLite default, which is what caused the production data loss earlier.
      - key: DATABASE_URL
        sync: false
      # Secrets already configured on the running service are left untouched
      # (sync: false) — values below only apply to a freshly created service.
      - key: SECRET_KEY
        sync: false
      - key: SEED_DEFAULT_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_ORIGIN_REGEX
        sync: false